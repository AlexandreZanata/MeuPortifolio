version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Framework packages are released together and must move together.
      next:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      tooling:
        patterns: ['*']
        exclude-patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
